<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Live trip · WitsPath</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="stylesheet" href="/css/companion.css" />
    <link rel="stylesheet" href="/vendor/leaflet-1.9.4/leaflet.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" style="color: inherit; text-decoration: none">
          <div class="brand-mark" aria-hidden="true">W</div>
          <div class="brand-copy">
            <span class="brand-name">WitsPath</span>
            <span class="brand-sub">Live trip</span>
          </div>
        </a>
      </header>

      <main class="page-layout">
        <section class="panel page-panel" aria-labelledby="trackTitle">
          <h1 id="trackTitle">Loading live trip…</h1>
          <p id="trackLive" class="page-live-indicator" hidden>Live</p>
          <!-- Status lines come from the server's verified phrase templates. -->
          <ul id="trackStatus" class="page-status" aria-live="polite"></ul>
          <p class="companion-small">
            Shared with the sender's consent. Positions are approximate, and distances are in a straight line, not along
            the walking route. This page updates automatically.
          </p>
          <p id="trackError" class="companion-small" role="alert"></p>
        </section>

        <section class="panel" aria-label="Map">
          <div id="trackMap" class="page-map"></div>
        </section>
      </main>
    </div>

    <script src="/js/settings.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/vendor/leaflet-1.9.4/leaflet.js"></script>
    <script src="/js/tracking/map-adapter.js"></script>
    <script src="/js/tracking/track.js"></script>
  </body>
</html>
