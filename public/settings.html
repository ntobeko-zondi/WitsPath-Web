<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings · WitsPath</title>
    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="stylesheet" href="/css/companion.css" />
    <link rel="stylesheet" href="/css/pages.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" style="color: inherit; text-decoration: none">
          <div class="brand-mark" aria-hidden="true">W</div>
          <div class="brand-copy">
            <span class="brand-name">WitsPath</span>
            <span class="brand-sub" data-i18n="nav_settings">Settings</span>
          </div>
        </a>
      </header>

      <main class="page-layout single">
        <section class="panel page-panel" aria-labelledby="settingsTitle">
          <h1 id="settingsTitle" data-i18n="nav_settings">Settings</h1>
          <p id="syncNote" class="companion-small">Settings are saved on this device.</p>

          <form id="settingsForm" class="page-form">
            <fieldset>
              <legend data-i18n="nav_accessibility">Accessibility</legend>
              <label class="companion-field" for="settingTextSize">
                <span>Text size</span>
                <select id="settingTextSize">
                  <option value="small">Small</option>
                  <option value="default">Default</option>
                  <option value="large">Large</option>
                  <option value="huge">Huge</option>
                </select>
              </label>
              <label class="companion-check" for="settingContrast">
                <input id="settingContrast" type="checkbox" />
                <span>High contrast</span>
              </label>
            </fieldset>

            <fieldset>
              <legend>Routes</legend>
              <label class="companion-check" for="settingStepFree">
                <input id="settingStepFree" type="checkbox" />
                <span>Step-free routes only</span>
              </label>
              <label class="companion-field" for="settingSpeed">
                <span>Walking or wheeling speed</span>
                <input id="settingSpeed" type="range" min="0.5" max="1.5" step="0.1" aria-describedby="settingSpeedValue settingSpeedHelp" />
                <output id="settingSpeedValue" for="settingSpeed"></output>
                <small id="settingSpeedHelp" class="companion-small">
                  Used for travel-time estimates in the website and companion. 1.0× is the WitsPath default of 1.4 metres
                  per second; choose a lower value if you usually move more slowly.
                </small>
              </label>
            </fieldset>

            <fieldset aria-describedby="profileHelp">
              <legend>Mobility profile</legend>
              <label class="companion-check"><input type="radio" name="settingProfile" value="none" /> <span data-i18n="mobility_none">No preference</span></label>
              <label class="companion-check"><input type="radio" name="settingProfile" value="wheelchair" /> <span data-i18n="mobility_wheelchair">Wheelchair</span></label>
              <label class="companion-check"><input type="radio" name="settingProfile" value="walking_aid" /> <span data-i18n="mobility_walking_aid">Walking aid</span></label>
              <label class="companion-check"><input type="radio" name="settingProfile" value="low_vision" /> <span data-i18n="mobility_low_vision">Low vision</span></label>
              <small id="profileHelp" class="companion-small">Never shown to other people.</small>
            </fieldset>

            <fieldset>
              <legend data-i18n="nav_language">Language</legend>
              <label class="companion-field" for="settingLanguage">
                <span>Interface language</span>
                <select id="settingLanguage"></select>
              </label>
            </fieldset>

            <fieldset id="syncGroup" hidden>
              <legend>Account</legend>
              <label class="companion-check" for="settingSync">
                <input id="settingSync" type="checkbox" />
                <span>Sync my settings with my WitsPath account (website and Android app)</span>
              </label>
            </fieldset>
          </form>
          <p id="settingsStatus" class="companion-small" role="status" aria-live="polite"></p>
          <a class="companion-secondary page-link-button" href="/saved.html" data-i18n="nav_saved_places">Saved places</a>
        </section>
      </main>
    </div>

    <script src="/js/settings.js"></script>
    <script src="/js/firebase-config.js"></script>
    <script src="/js/account/auth.js"></script>
    <script src="/js/account/settings-page.js"></script>
  </body>
</html>
