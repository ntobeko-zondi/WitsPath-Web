<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Create and manage your local WitsPath accessibility reports." />
    <meta name="theme-color" content="#073b67" />
    <title>My Reports | WitsPath</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/account.css" />
    <link rel="stylesheet" href="css/reports.css" />
  </head>
  <body>
    <div class="account-shell">
      <header class="topbar" aria-label="WitsPath header">
        <div class="product-title"><h1>WitsPath Reports</h1><p>Campus access reports</p></div>
        <span class="header-divider" aria-hidden="true"></span>
        <a class="university-brand" href="index.html" aria-label="Wits University home">
          <span class="crest" aria-hidden="true">
            <svg viewBox="0 0 40 48"><path d="M20 2 35 8v14c0 10-6 17-15 23C11 39 5 32 5 22V8L20 2Z" /><path d="M9 12h22v12H9zM9 27c5 0 7 5 11 5s6-5 11-5" /><path d="M15 12v12m10-12v12M4 19H1m38 0h-3" /><circle cx="20" cy="7" r="2" /></svg>
          </span>
          <span class="university-wordmark"><span class="wits-word">WITS</span><span class="university-word">UNIVERSITY</span></span>
        </a>
      </header>
      <nav class="account-nav" aria-label="Page navigation">
        <a class="back-to-home" href="index.html"><span aria-hidden="true">←</span> Back to Home</a>
        <div class="account-nav-links">
          <a href="index.html">Home</a>
          <span class="account-nav-current" aria-current="page">My Reports</span>
          <a href="account.html">Account</a>
        </div>
      </nav>
      <main class="reports-content">
        <div class="reports-heading">
          <div><h2>My Reports</h2><p>Reports are saved on this device.</p></div>
          <button class="account-save" id="openReport" type="button">Report an Issue</button>
        </div>
        <p id="reportsStatus" class="profile-status" role="status" aria-live="polite"></p>
        <div id="reportsList" class="reports-list" aria-live="polite"></div>
      </main>
    </div>

    <dialog id="reportDialog" class="report-dialog" aria-labelledby="reportDialogTitle">
      <form id="reportForm" class="report-form">
        <div class="report-dialog-heading"><h2 id="reportDialogTitle">Report an Issue</h2><button id="closeReport" class="icon-button" type="button" aria-label="Close report form">×</button></div>
        <label class="account-field" for="issueType"><span>Issue type</span>
          <select id="issueType" required>
            <option value="">Choose an issue</option>
            <option>Blocked path</option><option>Broken/unsafe ramp</option><option>Lift unavailable</option><option>Stairs blocking accessible route</option><option>Construction</option><option>Incorrect map information</option><option>Accessibility issue</option><option>Other</option>
          </select>
        </label>
        <label class="account-field" for="reportLocation"><span>Campus location</span><select id="reportLocation" required><option value="">Choose a location</option></select></label>
        <label class="account-field" for="reportDescription"><span>Description</span><textarea id="reportDescription" rows="4" maxlength="1500" required></textarea></label>
        <fieldset class="report-route-fields">
          <legend>Route information (optional)</legend>
          <label class="account-field" for="routeStart"><span>Start</span><select id="routeStart"><option value="">Choose a start</option></select></label>
          <label class="account-field" for="routeDestination"><span>Destination</span><select id="routeDestination"><option value="">Choose a destination</option></select></label>
          <label class="account-field" for="routeMode"><span>Route mode</span><select id="routeMode"><option value="">Choose a route mode</option><option value="wheelchair">Wheelchair Accessible</option><option value="walking-aid">Walking Aid</option><option value="visual">Visual Assistance</option><option value="general">General Route</option></select></label>
        </fieldset>
        <div class="report-form-actions"><button class="account-save" type="submit">Submit Report</button></div>
      </form>
    </dialog>
    <script src="app/storage.js"></script>
    <script src="app/reports.js"></script>
  </body>
</html>
